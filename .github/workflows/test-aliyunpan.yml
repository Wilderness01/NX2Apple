# 测试 GitHub runner（xcode-27）到阿里云盘的上传链路是否通，不用真账号。
# 只验证：aliyunpan 工具能装能跑、阿里云盘 API 从 runner 上能连通、
# 用假 token 登录时返回的是“鉴权失败”而不是“网络不通”。
# 真正传文件需要用户把 RefreshToken 存进 Secret ALIPAN_REFRESH_TOKEN，
# 那一步不在这个测试里。
# 手动触发，用完可以删掉这个文件。
name: Test AliyunPan upload path (no credentials)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Install aliyunpan
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -L -o aliyunpan.zip https://github.com/tickstep/aliyunpan/releases/download/v0.4.0/aliyunpan-v0.4.0-darwin-macos-arm64.zip
          unzip -o aliyunpan.zip
          # zip 里是 aliyunpan-v0.4.0-darwin-macos-arm64/aliyunpan，不是顶层的 aliyunpan
          mv aliyunpan-v0.4.0-darwin-macos-arm64/aliyunpan ./aliyunpan
          chmod +x ./aliyunpan
          ls -lh aliyunpan
          ./aliyunpan version

      - name: Connectivity to Aliyun Drive
        run: |
          set -euo pipefail
          for u in https://api.aliyundrive.com https://www.alipan.com https://auth.aliyundrive.com; do
            echo "== $u"
            curl -o /dev/null -s -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" --max-time 30 "$u" || echo "FAILED: $u"
          done

      - name: Login with dummy token (expect auth failure, not network failure)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # 故意用假 token：如果 API 能连通，aliyunpan 会报登录失败/鉴权错误；
          # 如果网络不通，会报连接超时/DNS 错误。只看是哪一种。
          ./aliyunpan login -RefreshToken=dummy-token-for-connectivity-test || true
          echo "--- token status ---"
          ./aliyunpan token || true
          echo "--- quota (needs login, expected to fail) ---"
          ./aliyunpan quota || true
