#    跑完出一个 GitHub Artifact（SuperMarioOdyssey-V1.3.52），老大直接从那下载。
#    原因：服务账号自己没有云盘存储空间，rclone 会报 403 storageQuotaExceeded，
#    且 GDRIVE_SA_KEY 已删。NSP 输入改走 rclone + 自有 Client ID（RCLONE_CONFIG Secret），
#    不再用 gdown 公开链接（公开下载有单文件配额锁，#50 死在这）。
name: Build NX2Apple single-game IPA (iPhone, manual)

on:
  workflow_dispatch:
    inputs:
      drive_base_path:
        description: "Google Drive 路径：本体 NSP（rclone gdrive: 后面的路径）"
        required: true
        default: "马里奥奥德赛/本体.nsp"
      drive_update_path:
        description: "Google Drive 路径：更新 NSP（rclone gdrive: 后面的路径）"
        required: true
        default: "马里奥奥德赛/升级包.nsp"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Sync engine
        run: |
          set -euo pipefail
          python3 tools/engine.py sync
          du -sh engine

      - name: Install build tools
        run: |
          set -euo pipefail
          brew bundle --file=Brewfile

      - name: Python venv and packages
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install lz4 capstone fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Download NSPs from Google Drive (rclone)
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          BASE_PATH: ${{ inputs.drive_base_path }}
          UPDATE_PATH: ${{ inputs.drive_update_path }}
        run: |
          set -euo pipefail
          # rclone + 自有 Client ID 走 Drive API，不走 gdown 公开链接：
          # 公开下载有单文件配额锁（#50 死在这），API 路线是 GCP 项目每天 1TB 出站，
          # 两个 NSP 约 6GB，远碰不到上限。--transfers 2 --checkers 4 防单秒查询率限制。
          test -n "$RCLONE_CONF_CONTENT"
          brew install rclone
          mkdir -p ~/.config/rclone "$RUNNER_TEMP/game"
          printf '%s' "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone copyto "gdrive:$BASE_PATH" "$RUNNER_TEMP/game/base.nsp" --transfers 2 --checkers 4 --progress
          rclone copyto "gdrive:$UPDATE_PATH" "$RUNNER_TEMP/game/update.nsp" --transfers 2 --checkers 4 --progress
          ls -lh "$RUNNER_TEMP/game/"
          # 本体约 5.2GB、更新约 379MB；下到确认页/小文件就直接失败，别往下编
          test "$(stat -f%z "$RUNNER_TEMP/game/base.nsp")" -gt 1000000000
          test "$(stat -f%z "$RUNNER_TEMP/game/update.nsp")" -gt 100000000

      - name: Write prod.keys from secret
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -euo pipefail
          test -n "$PROD_KEYS"
          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          chmod 600 "$RUNNER_TEMP/prod.keys"
          wc -l "$RUNNER_TEMP/prod.keys"

      - name: Install Metal Toolchain
        run: |
          set -euo pipefail
          # runner 上没有 Metal Toolchain 时，build.py 的 metal_check.py 会报错，
          # 先装上再编，否则编 IPA 一启动就失败。
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Build single-game IPA
        env:
          IOS_PULL: "1"
          # V1.3.52 stub 快编：设 DM_SKIP_SHADER_PREBUILD=1，跳过着色器预编译（约 12 分钟）；
          # 着色器 .img 已在老大手机 Documents/msl/ 里，不用重编、不另传；0124 的 DM_COPY_MSL 这次不用。
          DM_SKIP_SHADER_PREBUILD: "1"
        run: |
          set -euo pipefail
          source .venv/bin/activate
          # UW 超宽屏的 env（0098 补丁的 uw.c 要读这些，不设则 UW 静默不生效）：
          # --env-file 把它们烘进 IPA 的 dm/env.txt，装上即用。
          # 0225 诊断版：DM_FS=1 开全文件打开日志（钉死存档文件名与读取时机）；诊断专用，0226 前删掉。
          printf '%s\n' 'DM_ASPECT=auto' 'DM_UW_NOPATCH=1' 'DM_UW_CAM=0x136f550,0x13540e8' 'DM_UW_VTSLOT=13' 'DM_UW_UI=6' 'DM_UW_ORTHO_MODE=widen' 'DM_FS=1' > "$RUNNER_TEMP/uw-env.txt"
          # 只编单游戏 IPA，不再编壳 App：不带 --shell-framework（那是给壳 App 编游戏 framework 的），
          # 不再跑 build_shell.sh。--romfs separate：romfs.img 不打进 IPA（包外，约 5.68GB，已在手机上），
          # IPA 只含代码 + stub（不含着色器，约 166MB）；着色器 .img 已在老大手机
          # Documents/games/0100000000010000/msl/ 里，不用再放。覆盖安装即可，
          # romfs.img 和存档都在单游戏 App 的 Documents 里，不会丢。
          # -o 直接指定产物名（默认是 SuperMarioOdyssey.ipa，写在 NSP 文件夹里）。
          mkdir -p out
          python3 engine/scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" -k "$RUNNER_TEMP/prod.keys" --romfs separate --env-file "$RUNNER_TEMP/uw-env.txt" -o "$PWD/out/SuperMarioOdyssey-V1.3.52.ipa"
          test -f out/SuperMarioOdyssey-V1.3.52.ipa
          # 2026-11-07 只出 IPA 版：不再把磁盘上的 RomFS.img 拷到 out/ 里（不上传，runner 销毁即丢弃）。
          ls -lh out/

      - name: Upload single-game IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioOdyssey-V1.3.52
          path: "out/SuperMarioOdyssey-V1.3.52.ipa"
          if-no-files-found: error

      # 动作指南的离线 HTML 页已在老大手机 Documents/games/0100000000010000/html 里（一次性拷的），
      # 各版 html 内容相同（同一份 NSP），不再每版传 artifact。

      # 2026-11-07 只出 IPA 版：romfs.img 不再上传（已验证的那份留在老大手机上）。
      # 注意：build 过程本身仍会在磁盘上产出 RomFS.img，只是不拷出、不上传，runner 销毁即丢弃。
