# GitHub Mac 云主机上编 NX2Apple 的 iPhone 壳 App（shell app，带游戏库），不是单游戏 IPA
# 放到 Wilderness01/NX2Apple 的 .github/workflows/build-shell-mac.yml
# 手动触发：两个 Google Drive 文件 ID 有默认值，prod.keys 走 GitHub Secret，绝不进仓库、不进日志。
#
# 做法依据（2026-11-07 已核对 README + frontend 源码）：
#   单游戏 IPA 是 engine/scripts/build_ipa_from_nsp.py 不带 --shell-framework 的产物，
#   打开就是单个游戏，没有游戏库。README 说的 iPhone App 是壳 App：
#   每个游戏用 --shell-framework 编成 DmGame<TitleID>.framework，
#   再用 engine/dm/ios/tools/build_shell.sh --prepare-xcode 生成 DmShell 工程，
#   xcodebuild 编出壳 App（scheme DmShell，bundle id org.nxnative.shell），
#   未签名打包成 SuperMarioOdyssey-V1.0.0.ipa（ShellExport.swift 的导出做法：CODE_SIGNING_ALLOWED=NO，
#   可执行文件用 Gen/DmShell.entitlements 做 ad-hoc 签名，zip 成 Payload/*.app）。
#   游戏数据 romfs.img 仍在包外，装好后拷到壳 App 的 Documents/games/0100000000010000/ 里。
# 游戏：0100000000010000，两个 NSP 文件（2026-11-06 20:25 核对，谷歌云盘已设 Anyone with the link）：
#   本体 SUPER MARIO ODYSSEY [0100000000010000] [v0].nsp，5,611,007,028 字节
#   更新 SUPER MARIO ODYSSEY [0100000000010800] [v393216].nsp，397,296,416 字节
#
# 限制：
# 1. 云主机上没有配对的 iPhone，做不了签名 + 安装；跑完拿到的是未签名 SuperMarioOdyssey-V1.0.0.ipa，
#    老大自己用 AltStore / SideStore 装。壳 App 的 bundle id 是 org.nxnative.shell，
#    和之前那个单游戏 App（org.nxnative.0100000000010000）是两个 App，互不覆盖。
# 2. GitHub 单次任务最长 6 小时；framework 那步要重编 shader（云主机是临时的，没缓存），
#    上次单游戏版 Build IPA 用了约 1 小时，这次差不多。
# 3. 壳 App 跟随手机系统语言（英文或简体中文）；游戏内语言在壳里每个游戏的设置里改，
#    或在 Documents/env.txt 写 DM_LANG=zh-Hans。
# 4. 跑完直接传谷歌云盘（最后一步 Upload to Google Drive）：用 rclone + 服务账号，
#    文件存在服务账号自己的云盘里，不占老大个人账号的 15GB，也不经过娜薇的主机；
#    传完设成 Anyone with the link，日志和 Summary 里直接给谷歌直链，不用再下载。
#    前提：仓库里要有 GitHub Secret GDRIVE_SA_KEY（Google Cloud 服务账号的 JSON key，
#    像 PROD_KEYS 一样只走 Secret，绝不进仓库、不进日志、不发聊天）。
#    没配这个 Secret 时这步在脚本里判空跳过，照常出 GitHub Artifacts。
#    注意：secrets 不能写在步骤的 if 条件里（2026-11-07 修，#9 启动失败就是这个原因）。
name: Build NX2Apple shell app (iPhone, manual)

on:
  workflow_dispatch:
    inputs:
      drive_base_id:
        description: "Google Drive 文件 ID：本体 NSP（链接里 /d/ 后面那串）"
        required: true
        default: "1-zXl12b9u_YsS-Oa16geyWsRsqjnX658"
      drive_update_id:
        description: "Google Drive 文件 ID：更新 NSP v393216（链接里 /d/ 后面那串）"
        required: true
        default: "1pZRDOKnn65E__-lDNfqtXwWUE6gKh2bA"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Sync engine
        run: |
          set -euo pipefail
          python3 tools/engine.py sync
          du -sh engine
          test -x engine/dm/ios/tools/build_shell.sh

      - name: Install build tools
        run: |
          set -euo pipefail
          brew bundle --file=Brewfile

      - name: Python venv and packages
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install lz4 capstone fonttools zbic nsz "backports.zstd; python_version < '3.14'" gdown

      - name: Download NSPs from Google Drive
        env:
          BASE_ID: ${{ inputs.drive_base_id }}
          UPDATE_ID: ${{ inputs.drive_update_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game"
          .venv/bin/python -m gdown "$BASE_ID" -O "$RUNNER_TEMP/game/base.nsp"
          .venv/bin/python -m gdown "$UPDATE_ID" -O "$RUNNER_TEMP/game/update.nsp"
          ls -lh "$RUNNER_TEMP/game/"
          # 本体约 5.2GB、更新约 379MB；下到确认页/小文件就直接失败，别往下编
          test "$(stat -f%z "$RUNNER_TEMP/game/base.nsp")" -gt 1000000000
          test "$(stat -f%z "$RUNNER_TEMP/game/update.nsp")" -gt 100000000

      - name: Write prod.keys from secret
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -euo pipefail
          test -n "$PROD_KEYS"
          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          chmod 600 "$RUNNER_TEMP/prod.keys"
          wc -l "$RUNNER_TEMP/prod.keys"

      - name: Install Metal Toolchain
        run: |
          set -euo pipefail
          # runner 上没有 Metal Toolchain 时，build.py 的 metal_check.py 会报错，
          # 先装上再编，否则编 framework 一启动就失败。
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Build game framework
        run: |
          set -euo pipefail
          source .venv/bin/activate
          # 带 --shell-framework：只编游戏的 framework，不出单游戏 IPA。
          # framework 写在 $RUNNER_TEMP/shell-framework/DmGame<TitleID>.framework
          python3 engine/scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" -k "$RUNNER_TEMP/prod.keys" --shell-framework "$RUNNER_TEMP/shell-framework"
          find "$RUNNER_TEMP/shell-framework" -maxdepth 1 -name 'DmGame*.framework' -exec ls -ld {} \;

      - name: Build shell app
        env:
          SHELL_DIR: ${{ runner.temp }}/shell
          DM_SHELL_FRAMEWORKS: ${{ runner.temp }}/shell-framework/DmGame0100000000010000.framework
          DM_BUNDLE_ID: org.nxnative.shell
        run: |
          set -euo pipefail
          # build_shell.sh --build：生成 DmShell 工程并用 xcodebuild 编出未签名的壳 App。
          # DM_SHELL_PACKAGE 用仓库根目录的 frontend-ios（engine 里没有这个包）。
          export DM_SHELL_PACKAGE="$PWD/frontend-ios"
          export FONT_PY="$PWD/.venv/bin/python"
          bash engine/dm/ios/tools/build_shell.sh --build
          ls -lh "$SHELL_DIR/dd/Build/Products/Release-iphoneos/DmShell.app"

      - name: Pack shell IPA
        env:
          SHELL_DIR: ${{ runner.temp }}/shell
        run: |
          set -euo pipefail
          mkdir -p out/stage/Payload
          APP="$SHELL_DIR/dd/Build/Products/Release-iphoneos/DmShell.app"
          # 未签名的 App 没有签名来带 entitlements（Increased Memory Limit），
          # 给可执行文件做 ad-hoc 签名把 entitlements 带上，AltStore 装时会替换并保留。
          /usr/bin/xattr -cr "$APP/DmShell"
          /usr/bin/codesign --force --sign - --entitlements "$SHELL_DIR/Gen/DmShell.entitlements" "$APP/DmShell"
          cp -R "$APP" out/stage/Payload/
          ditto -c -k --sequesterRsrc --keepParent out/stage/Payload out/SuperMarioOdyssey-V1.0.0.ipa
          # 2026-11-07 只出 IPA 版：不再把磁盘上的 RomFS.img 拷到 out/ 里（不上传，runner 销毁即丢弃）。
          ls -lh out/

      - name: Upload shell IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioOdyssey-V1.0.0
          path: "out/SuperMarioOdyssey-V1.0.0.ipa"
          if-no-files-found: error

      # 2026-11-07 只出 IPA 版：romfs.img 不再上传（已验证的那份留在老大手机上）。
      # 注意：build 过程本身仍会在磁盘上产出 RomFS.img，只是不拷出、不上传，runner 销毁即丢弃。

      - name: Upload to Google Drive (direct link)
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          set -euo pipefail
          # 注意（2026-11-07 修）：secrets 不能写在步骤的 if 条件里，
          # 那样会让整个 workflow 文件无效、运行启动失败（#9 就是这么死的）。
          # 所以这步不设 if，改成脚本里判断：没配 Secret 就直接跳过。
          if [ -z "$GDRIVE_SA_KEY" ]; then
            echo "GDRIVE_SA_KEY not set, skipping Drive upload."
            exit 0
          fi
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          brew install rclone
          export RCLONE_CONFIG_GDRIVE_TYPE=drive
          export RCLONE_CONFIG_GDRIVE_SCOPE=drive
          export RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/sa.json"
          # 先删上次的同名文件，免得服务账号的 15GB 被旧文件占满
          # 2026-11-07 只出 IPA 版：这里不再删、不再传 romfs.img（已验证的那份不能动）。
          rclone delete gdrive:NX2Apple/SuperMarioOdyssey-V1.0.0.ipa || true
          rclone copy out/SuperMarioOdyssey-V1.0.0.ipa gdrive:NX2Apple/ --progress
          IPA_ID=$(rclone lsjson gdrive:NX2Apple/SuperMarioOdyssey-V1.0.0.ipa | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['ID'])")
          # 设成 Anyone with the link（rclone link 会建这个权限并返回分享链接）
          rclone link gdrive:NX2Apple/SuperMarioOdyssey-V1.0.0.ipa >/dev/null
          {
            echo "## 谷歌直链（Anyone with the link）"
            echo ""
            echo "- 壳 App SuperMarioOdyssey-V1.0.0.ipa：https://drive.google.com/uc?export=download&id=$IPA_ID"
          } | tee -a "$GITHUB_STEP_SUMMARY"
