# Extract Odyssey main NSO for widescreen reverse-engineering.
# Downloads the two Odyssey NSPs from Google Drive, decrypts them with the
# PROD_KEYS secret (never leaves GitHub), extracts the main executable (NSO)
# from the update (v1.4.1) program NCA, and uploads it as an artifact.
# The main NSO is used on the host to disassemble Odyssey's projection /
# viewport / HUD code and build an adaptive widescreen patch (iPhone 19.5:9
# wider, iPad 4:3 taller). Manual trigger only.
name: Extract Odyssey main NSO

on:
  workflow_dispatch:

jobs:
  extract-main:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Install tools
        run: |
          brew install hactool 2>/dev/null || true
          which hactool || (echo "hactool not in brew, building from source" && git clone --depth 1 https://github.com/Thealexbarney/hactool.git /tmp/hactool && cd /tmp/hactool && cp config.mk.template config.mk && make -j4 && sudo cp hactool /usr/local/bin/hactool)
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install gdown
          hactool 2>&1 | head -2
          .venv/bin/python -m gdown --help 2>&1 | head -3

      - name: Download NSPs from Google Drive
        run: |
          set -euo pipefail
          mkdir -p nsp out
          .venv/bin/python -m gdown "1-zXl12b9u_YsS-Oa16geyWsRsqjnX658" -O nsp/base.nsp
          .venv/bin/python -m gdown "1pZRDOKnn65E__-lDNfqtXwWUE6gKh2bA" -O nsp/update.nsp
          ls -lh nsp/
          test "$(stat -f%z nsp/base.nsp)" -gt 1000000000
          test "$(stat -f%z nsp/update.nsp)" -gt 100000000

      - name: Write prod.keys from secret
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          printf '%s' "$PROD_KEYS" > prod.keys
          wc -c prod.keys

      - name: Extract main NSO
        run: |
          set -e
          # Helper: given an NSP, unpack its PFS0, find the Program NCA,
          # extract its section 0 (a PFS0) and pull out "main".
          # Usage: extract_main <nsp> <out_name>
          extract_main() {
            local nsp="$1" out_name="$2"
            rm -rf nsp/pfs0 && mkdir -p nsp/pfs0
            hactool -k prod.keys --pfs0dir=nsp/pfs0 "$nsp"
            echo "NCAs in $nsp:"
            ls -lh nsp/pfs0/
            for nca in nsp/pfs0/*.nca; do
              echo "== checking $nca"
              info=$(hactool -k prod.keys -i "$nca" 2>&1 || true)
              echo "$info" | head -20
              # Program NCA has content type Program.
              if echo "$info" | grep -qi "content type.*program"; then
                echo "Program NCA: $nca"
                rm -rf nsp/sec0 && mkdir -p nsp/sec0
                hactool -k prod.keys --section0=nsp/sec0.bin "$nca"
                rm -rf nsp/sec0files && mkdir -p nsp/sec0files
                hactool -k prod.keys -t pfs0 --pfs0dir=nsp/sec0files nsp/sec0.bin
                ls -lh nsp/sec0files/
                if [ -f nsp/sec0files/main ]; then
                  cp nsp/sec0files/main "out/$out_name"
                  echo "Saved out/$out_name"
                  return 0
                fi
              fi
            done
            return 1
          }
          if extract_main nsp/update.nsp main-update.nso; then
            echo "Got main from update NSP (v1.4.1)"
          elif extract_main nsp/base.nsp main-base.nso; then
            echo "Got main from base NSP (v0)"
          else
            echo "ERROR: main NSO not found in either NSP"
            exit 1
          fi
          ls -lh out/
          file out/*.nso 2>/dev/null || true

      - name: Upload main NSO
        uses: actions/upload-artifact@v4
        with:
          name: Odyssey-main-nso
          path: out/*.nso
          retention-days: 30
