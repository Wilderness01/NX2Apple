# 草稿：GitHub Mac 云主机上编《超级马里奥 奥德赛》iPhone IPA（未验证、未提交）
# 放到 Wilderness01/NX2Apple 的 .github/workflows/build-odyssey-mac.yml
# 手动触发：填两个 Google Drive 文件 ID，prod.keys 走 GitHub Secret，绝不进仓库、不进日志。
#
# 做法依据（BUILDING.md，2026-11-06 已核对）：
#   python3 tools/engine.py sync
#   brew bundle --file=Brewfile
#   venv + pip install lz4 capstone fonttools zbic nsz backports.zstd
#   python3 engine/scripts/build_ipa_from_nsp.py <游戏文件夹> -k <prod.keys>
# 游戏：0100000000010000，两个 NSP 文件（2026-11-06 20:25 核对，谷歌云盘已设 Anyone with the link）：
#   本体 SUPER MARIO ODYSSEY [0100000000010000] [v0].nsp，5,611,007,028 字节
#   更新 SUPER MARIO ODYSSEY [0100000000010800] [v393216].nsp，397,296,416 字节
#   两个文件都放进同一个游戏文件夹，脚本取文件夹里最新版本打包。
#
# 先说清三个限制，别当成一键出 IPA 就能直接玩：
# 1. 默认出的是 slim IPA（RomFS 不在包里），游戏数据 romfs.img 另有产出；
#    本 workflow 把 IPA 和 romfs.img 都传回 Artifacts（2026-11-06 20:26 老大确认：
#    回传需要 IPA 和数据包）。装到 iPhone 后把 romfs.img 放到
#    App 的 Documents/games/0100000000010000/ 里。
# 2. 云主机上没有配对的 iPhone，做不了“签名 + 安装 + 拷游戏”那一步；
#    跑完拿到的是未签名 IPA，老大自己用 AltStore / SideStore 这类方式装。
# 3. GitHub 单次任务最长 6 小时；Windows 上 shader 翻译那步最耗时，Mac 原生 Metal
#    应该快一些，但没实测过，超时就失败。Windows 电脑上已编好的 shader 缓存传不到云主机，
#    这次是从 0 开始编。
#
# 还没验证的点（第一次跑就是实测）：
# - build_ipa_from_nsp.py 在 Mac runner 上产出的 IPA 确切路径 —— 下面用 **/*.ipa 通配上传，
#   如果跑完报 if-no-files-found，看日志里的实际路径再改。
# - gdown 下 5 GB+ 大文件在 runner 上的速度和稳定性。
name: Build Super Mario Odyssey IPA (Mac, manual)

on:
  workflow_dispatch:
    inputs:
      drive_base_id:
        description: "Google Drive 文件 ID：本体 NSP（链接里 /d/ 后面那串）"
        required: true
      drive_update_id:
        description: "Google Drive 文件 ID：更新 NSP v393216（链接里 /d/ 后面那串）"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Sync engine
        run: |
          set -euo pipefail
          python3 tools/engine.py sync
          du -sh engine

      - name: Install build tools
        run: |
          set -euo pipefail
          brew bundle --file=Brewfile

      - name: Python venv and packages
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install lz4 capstone fonttools zbic nsz "backports.zstd; python_version < '3.14'" gdown

      - name: Download NSPs from Google Drive
        env:
          BASE_ID: ${{ inputs.drive_base_id }}
          UPDATE_ID: ${{ inputs.drive_update_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game"
          .venv/bin/python -m gdown "$BASE_ID" -O "$RUNNER_TEMP/game/base.nsp"
          .venv/bin/python -m gdown "$UPDATE_ID" -O "$RUNNER_TEMP/game/update.nsp"
          ls -lh "$RUNNER_TEMP/game/"
          # 本体约 5.2GB、更新约 379MB；下到确认页/小文件就直接失败，别往下编
          test "$(stat -f%z "$RUNNER_TEMP/game/base.nsp")" -gt 1000000000
          test "$(stat -f%z "$RUNNER_TEMP/game/update.nsp")" -gt 100000000

      - name: Write prod.keys from secret
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -euo pipefail
          test -n "$PROD_KEYS"
          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          chmod 600 "$RUNNER_TEMP/prod.keys"
          wc -l "$RUNNER_TEMP/prod.keys"

      - name: Install Metal Toolchain
        run: |
          set -euo pipefail
          # 第二次运行（run #2）在这里失败：runner 上没有 Metal Toolchain，
          # build.py 的 metal_check.py 报错 cannot execute tool 'metal'。
          # 先装上再编，否则 Build IPA 一启动就失败。
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Build IPA
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python3 engine/scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" -k "$RUNNER_TEMP/prod.keys"
          find "$RUNNER_TEMP" -name '*.ipa' -exec ls -lh {} \;

      - name: Stage outputs
        run: |
          set -euo pipefail
          mkdir -p out
          # IPA 和游戏数据可能落在工作区或 RUNNER_TEMP，先都收到 out/ 里再上传。
          # 注意：解包出来的数据镜像在磁盘上叫 RomFS.img（大写 R/F），不是小写的
          # romfs.img，find 必须用 -iname 忽略大小写，否则永远找不到；
          # 拷出来后改回小写 romfs.img，iPhone 上 App 认的是小写名字。
          find "$RUNNER_TEMP" \( -iname '*.ipa' -o -iname 'romfs.img' \) -exec cp -v {} out/ \;
          find . -not -path './out/*' \( -iname '*.ipa' -o -iname 'romfs.img' \) -exec cp -v {} out/ \;
          if [ -f out/RomFS.img ]; then mv out/RomFS.img out/romfs.img; fi
          ls -lh out/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioOdyssey-ipa
          path: "out/SuperMarioOdyssey.ipa"
          if-no-files-found: error

      - name: Upload game data (romfs.img)
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioOdyssey-romfs
          path: "out/romfs.img"
          if-no-files-found: error
