# GitHub Mac 云主机上编 NX2Apple 的 iPhone 单游戏 IPA（DmIOS.app），不是壳 App
# V1.3.19-probe3：带 0104 补丁（UW trampoline 同步持久写：calcMatrix 期间写字段且不恢复，止住 aspect 字段震荡，修全屏阴影变大闪烁）+ 0106 补丁（16:9 直方图诊断；它带的 set-nop 已被停掉，见下）+ 0110 补丁（虚拟按键换成线稿皮肤（唯一一套，无切换、无 DM_PAD_SKIN 设置项）：黑白线稿+金色弧线 12 张图标（512x512），左摇杆浮动隐藏（左半边任意区域按下即在触点冒出、跟手指走、抬手隐藏），X/ZR/R/L3/R3/十字键隐藏且输入禁掉，ZL 撞地/L 视角/Y 攻击/A/B 字母换图，+/− 齿轮换图（+/− 是圆形），新增跳跃键（=B，在菱形左侧）和拍照键（=十字键下，在跳跃左侧），齿轮菜单加“按键设置”（大小滑块 0.7–1.4 + 拖图标改位置，布局存 NSUserDefaults DmPadLineLayout，重启还在）；0110 还折进 0108 的两样东西（set-nop 停掉：iOS 代码签名不允许运行时改 __TEXT，V1.3.5 因此一开就闪退；图标打进框架 bundle 并改从框架 bundle 读）；0107 枪灰和 0109 双皮肤已从 series 去掉）。 + 0111 补丁（10 个线稿图标后面加液态玻璃圆盘：iOS 26+ 系统真玻璃 UIGlassEffect regular，26 以下回退矢量盘，跟着拖动和大小滑块走）。 + 0112 补丁（按键设置里点图标单独调大小，各存各的）。 + 0113 已移除（V1.3.14：HUD 取消——HUD 移动/调大小、HUD 设置界面、地图 ortho 放宽全删；ortho 代码已另存，地图放宽是后续独立补丁，不在这版）。 + 0114 补丁（图标大小滑块上限 3.0）。 + 0115 补丁（玻璃滑块 0–100%，70% 是现在的样子，100% 最深）。 + 0116 补丁（按键设置面板能任意拖动，位置存 NSUserDefaults，默认放左侧中部偏下、不挡右上角按键；HUD 设置面板随 0113 一并移除）。 + 0117 补丁（齿轮键进可调：第 10 个，大小和位置都能调，按键设置里点齿轮就是选中它、不开菜单）。 + 0118 补丁（HUD 自动贴边：钩 Pane::Calculate，金币/月亮左移、指南针/生命右移，偏移按屏幕比例自动算（iPhone 19.5:9 每边 +140、iPhone Duo 1.43:1 每边 −126、iPad 4:3 每边 −160、16:9 不动）；无设置、无拖动、无 HUD 设置界面；拍照键是虚拟按键、不动）。 + 工作流改动（Build single-game IPA 步加 IOS_PULL=1：编 iOS 版 _bp 占位管线，消 log-20 两下运行时现编管线长帧（454ms/307ms）；只改工作流，不占补丁号）。 + 0119 补丁（启动器 HUD 编辑器：启动器设置里加 HUD 设置入口，预览图（森林背景，四个比例：iPhone 19.5:9、Duo 1.43:1、iPad 4:3、16:9）、金币/月亮/生命/指南针可拖动改位置、滑块调大小 60%–180%、单独隐藏（隐藏后游戏里也不显示），全部恢复自动贴边；设置存 UserDefaults DmHudManual.0–3，启动时写 DM_HUD_* 环境变量，主机 hud_manual.c 拷到状态页 +0x200，游戏侧 hud_edge.c 读到后手动设置优先于自动贴边、隐藏的推到屏外；没手动设置的继续自动贴边）。 + 0120 补丁（HUD 数字丢失修复：edge 表每元素槽位 2→8（32 条），4 个金币 pane 不再抢槽重初始化、偏移不再每帧漂移，数字不再被推出屏幕）。 + 0121 补丁（单游戏启动器设置页中文：LauncherText.swift 按 fork 的 l10n 表（launch.set./launch.opt./launch.section.）翻译设置行/分组/启动器文案，缺键回退英文；模型里分组名保持英文，游戏内菜单的 Controls 匹配不受影响；iPad（4:3）选项在 l10n 里没有，在此补中文）。 + 0122 补丁（跳过着色器预编译的门：DM_SKIP_SHADER_PREBUILD=1 时才触发，这次 stub 快编设这个变量（下面 env 里），门触发、跳过着色器预编译；补丁留在 series 里备用）。 + 0123 补丁（启动器 HUD 编辑器按设计稿改：森林+马里奥背景原图（4 个比例各一张）、金币组（含六边形+020 和白条）/月亮组（只有点点）分组、指南针与提示词拆成 5 个元素、粗黑圆角设备外框、标题下署名 by 与荒野制作；游戏侧按新分组映射，父级补偿精确算）。 + 0124 补丁（着色器分离：DM_COPY_MSL=NO 时 msl 不打进 IPA，.img 另传，游戏从 Documents/games/<id>/msl/b-<chain>.img 加载）。 + 0125 补丁（HUD 编辑器预览自适应：按容器缩放，四个比例横竖屏都完整显示）。 + 0126 补丁（HUD 贴边根因：edge 表每元素槽位 8→16（80 条），金币 10 个 pane 不再抢槽、数字不再每帧漂移出屏）。 + 0127 补丁（HUD 6 元素拆分：金币/地区金币/月亮分开调，新增 DM_HUD_REGIONAL，白条从编辑器去掉；外观保持 0123 原样）。 + 0129 补丁（诊断探针：只记日志不改行为，DM_HUD_PROBE=1 开启）。 + 0130 补丁（HUD 数字丢失修复：静态 pane 原始位置从本地变换（+0x30）+ 父级布局重建，父级减法保留（动态子 pane 需要），“同变换”提前返回加继承判定；金币数字回 139/123，地区数字回 -75/-85，指南针/生命不动）。 + 0131 补丁（诊断探针：layout 记录，每 pane 记本地 +0x30、父级本地 +0x30、e_orig；0130 真机零效果，需测布局到底在哪）。 + 0132 补丁（HUD 数字修复：log-41 判 H3——布局既不在 pane 本地也不在父级本地，整条链（TxtCounter→Capture03→RootPane）求和是 (0,-100) 不是 (263,71)；静态 pane 原始位置改从整条父链（+0x30 求和，不读任何 +0x70）重建，“同变换”提前返回只在原始位置来自链重建时才生效，地区 pane 不再被虚假提前返回留在原地；金币数字仍在 -140（布局不在链里，需再探），地区数字回 -192/-85，指南针/生命不动）。 + 0133 补丁（诊断探针：每 pane 再记两条记录——chain 记录整条父链的本地 +0x30（5 级 + 深度，log-41 的链最多 4 级）、fields 记录 pane 与父级的本地缩放 +0x48、尺寸 +0x50、原点 +0x5b 和 live 全局 +0x70；找 (263,71) 到底在哪个字段；每 pane 5 条记录，13 条上限不变，探针不改行为）。
# V1.3.19-probe3（stub 快编，带 0132 数字修复 + 0133 扩展示探针 + 0131 layout 探针 + 0129 探针）：这次改 hud_probe.c 与 hud_manual.c（0133：每 pane 加 chain 记录与 fields 记录，找 (263,71) 在哪个字段；hud_edge.c 的 0132 修复不动），
#   跳过着色器预编译（约 12 分钟，#47 的 stub 快编是 12 分 31 秒，供参考）。着色器 .img 已在
#   老大手机 Documents/games/0100000000010000/msl/ 里（V1.3.16 完整版产的 b-1d619d0f520b.img），
#   不用重编、不另传。IPA 只含代码 + stub（约 166MB 基础包，#47 的 stub 版实测 166MB——
#   0122 的 30–40MB 估算偏低，基础包本身就约 166MB），产物名 SuperMarioOdyssey-V1.3.19-probe3.ipa。
#   注意：0122 的门这次触发（DM_SKIP_SHADER_PREBUILD=1），stub 会把 c1_full.tsv/cb_extent.tsv
#   写空——游戏能跑、从 .img 加载着色器正常渲染，只会比完整版慢一点（和 V1.3.15 的 stub 版一样）；
#   真表在 V1.3.16 的完整编里已产出，若以后想恢复满速再出一次完整版即可。
#   0124 的 DM_COPY_MSL 这次不用（stub 本来就不编 msl），下面 env 里已去掉；
#   装好 IPA 后直接进游戏，不用再放 .img（已在手机里）。
# 放到 Wilderness01/NX2Apple 的 .github/workflows/build-shell-mac.yml
# 手动触发：两个 Google Drive 文件 ID 有默认值，prod.keys 走 GitHub Secret，绝不进仓库、不进日志。
#
# 做法依据（2026-11-07 已核对 README + frontend 源码；只编单游戏版，见下）：
#   单游戏 IPA 是 engine/scripts/build_ipa_from_nsp.py 不带 --shell-framework 的产物，
#   打开就是单个游戏，没有游戏库，bundle id 是 org.nxnative.0100000000010000（默认）。
#   不再编壳 App：不再用 --shell-framework 编游戏 framework，
#   不再跑 build_shell.sh 编 DmShell.app，不再打包壳 App。
#   用 --romfs separate：romfs.img 不打进 IPA（包外，约 5.68GB，已在手机上），
#   IPA 只含代码 + 预编译着色器，约 700MB；装好后把 romfs.img 和存档拷到
#   单游戏 App 的 Documents/games/0100000000010000/ 里（见迁移步骤）。
#   未签名 IPA：build_ipa_from_nsp.py -o 直接出 SuperMarioOdyssey-V1.3.19-probe3.ipa（未签名，
#   老大自己用 AltStore / SideStore 装）。
# 游戏：0100000000010000，两个 NSP 文件（2026-11-06 20:25 核对，谷歌云盘已设 Anyone with the link）：
#   本体 SUPER MARIO ODYSSEY [0100000000010000] [v0].nsp，5,611,007,028 字节
#   更新 SUPER MARIO ODYSSEY [0100000000010800] [v393216].nsp，397,296,416 字节
#
# 限制：
# 1. 云主机上没有配对的 iPhone，做不了签名 + 安装；跑完拿到的是未签名 SuperMarioOdyssey-V1.3.19-probe3.ipa，
#    老大自己用 AltStore / SideStore 装。单游戏 App 的 bundle id 是 org.nxnative.0100000000010000，
#    和壳 App（org.nxnative.shell）是两个 App，互不覆盖；装单游戏版不会动壳 App，
#    壳 App 删不删随老大，存档拷过去确认能玩再删壳 App。
# 2. GitHub 单次任务最长 6 小时；这次是 stub 快编，Build IPA 约 12 分钟（跳过着色器预编译），
#    IPA 约 166MB，只出一个 artifact，从 GitHub 下载。
# 3. 单游戏 App 的设置页已改中文（0121 补丁）；游戏内语言在设置页的游戏语言里改（已是简体中文），
#    或在 Documents/env.txt 写 DM_LANG=zh-Hans。
# 4. 谷歌云盘上传已去掉（2026-11-08）：最后一步不再往谷歌云盘传 IPA，
#    跑完出一个 GitHub Artifact（SuperMarioOdyssey-V1.3.19-probe3），老大直接从那下载。
#    原因：服务账号自己没有云盘存储空间，rclone 会报 403 storageQuotaExceeded，
#    且 GDRIVE_SA_KEY 已删。NSP 输入仍从谷歌云盘下载（gdown），那步不动。
name: Build NX2Apple single-game IPA (iPhone, manual)

on:
  workflow_dispatch:
    inputs:
      drive_base_id:
        description: "Google Drive 文件 ID：本体 NSP（链接里 /d/ 后面那串）"
        required: true
        default: "13nsuG48oVfglA6x3nqo_BslQ1ZDFwGw6"
      drive_update_id:
        description: "Google Drive 文件 ID：更新 NSP v393216（链接里 /d/ 后面那串）"
        required: true
        default: "1_EVMGS3UVG_JsolVcFMzRBDXI9jIJJVo"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Sync engine
        run: |
          set -euo pipefail
          python3 tools/engine.py sync
          du -sh engine

      - name: Install build tools
        run: |
          set -euo pipefail
          brew bundle --file=Brewfile

      - name: Python venv and packages
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install lz4 capstone fonttools zbic nsz "backports.zstd; python_version < '3.14'" gdown

      - name: Download NSPs from Google Drive
        env:
          BASE_ID: ${{ inputs.drive_base_id }}
          UPDATE_ID: ${{ inputs.drive_update_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game"
          .venv/bin/python -m gdown "$BASE_ID" -O "$RUNNER_TEMP/game/base.nsp"
          .venv/bin/python -m gdown "$UPDATE_ID" -O "$RUNNER_TEMP/game/update.nsp"
          ls -lh "$RUNNER_TEMP/game/"
          # 本体约 5.2GB、更新约 379MB；下到确认页/小文件就直接失败，别往下编
          test "$(stat -f%z "$RUNNER_TEMP/game/base.nsp")" -gt 1000000000
          test "$(stat -f%z "$RUNNER_TEMP/game/update.nsp")" -gt 100000000

      - name: Write prod.keys from secret
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -euo pipefail
          test -n "$PROD_KEYS"
          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          chmod 600 "$RUNNER_TEMP/prod.keys"
          wc -l "$RUNNER_TEMP/prod.keys"

      - name: Install Metal Toolchain
        run: |
          set -euo pipefail
          # runner 上没有 Metal Toolchain 时，build.py 的 metal_check.py 会报错，
          # 先装上再编，否则编 IPA 一启动就失败。
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Build single-game IPA
        env:
          IOS_PULL: "1"
          # V1.3.19-probe3 stub 快编：设 DM_SKIP_SHADER_PREBUILD=1，跳过着色器预编译（约 12 分钟）；
          # 着色器 .img 已在老大手机 Documents/msl/ 里，不用重编、不另传；0124 的 DM_COPY_MSL 这次不用。
          DM_SKIP_SHADER_PREBUILD: "1"
        run: |
          set -euo pipefail
          source .venv/bin/activate
          # UW 超宽屏的 env（0098 补丁的 uw.c 要读这些，不设则 UW 静默不生效）：
          # --env-file 把它们烘进 IPA 的 dm/env.txt，装上即用。
          printf '%s\n' 'DM_ASPECT=auto' 'DM_UW_NOPATCH=1' 'DM_UW_CAM=0x136f550,0x13540e8' 'DM_UW_VTSLOT=13' 'DM_UW_UI=6' 'DM_UW_ORTHO_MODE=widen' 'DM_HUD_PROBE=1' > "$RUNNER_TEMP/uw-env.txt"
          # 只编单游戏 IPA，不再编壳 App：不带 --shell-framework（那是给壳 App 编游戏 framework 的），
          # 不再跑 build_shell.sh。--romfs separate：romfs.img 不打进 IPA（包外，约 5.68GB，已在手机上），
          # IPA 只含代码 + stub（不含着色器，约 166MB）；着色器 .img 已在老大手机
          # Documents/games/0100000000010000/msl/ 里，不用再放。覆盖安装即可，
          # romfs.img 和存档都在单游戏 App 的 Documents 里，不会丢。
          # -o 直接指定产物名（默认是 SuperMarioOdyssey.ipa，写在 NSP 文件夹里）。
          mkdir -p out
          python3 engine/scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" -k "$RUNNER_TEMP/prod.keys" --romfs separate --env-file "$RUNNER_TEMP/uw-env.txt" -o "$PWD/out/SuperMarioOdyssey-V1.3.19-probe3.ipa"
          test -f out/SuperMarioOdyssey-V1.3.19-probe3.ipa
          # 2026-11-07 只出 IPA 版：不再把磁盘上的 RomFS.img 拷到 out/ 里（不上传，runner 销毁即丢弃）。
          ls -lh out/

      - name: Upload single-game IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioOdyssey-V1.3.19-probe3
          path: "out/SuperMarioOdyssey-V1.3.19-probe3.ipa"
          if-no-files-found: error

      # 2026-11-07 只出 IPA 版：romfs.img 不再上传（已验证的那份留在老大手机上）。
      # 注意：build 过程本身仍会在磁盘上产出 RomFS.img，只是不拷出、不上传，runner 销毁即丢弃。
